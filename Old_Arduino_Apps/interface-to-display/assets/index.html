<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LCD Interface</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="wrap">
    <header class="topbar">
      <div class="brand">
        <div class="dot"></div>
        <div>
          <div class="title">UNO Q LCD Interface</div>
          <div class="subtitle">Type two lines and send them to the 16×2 LCD</div>
        </div>
      </div>

      <div class="conn">
        <span class="badge" id="connBadge">Connecting…</span>
      </div>
    </header>

    <main class="grid">
      <section class="card">
        <h2>Compose</h2>

        <div class="field">
          <label for="line1">Line 1</label>
          <div class="inputRow">
            <input id="line1" maxlength="16" placeholder="Hello" autocomplete="off" />
            <div class="counter"><span id="c1">0</span>/16</div>
          </div>
        </div>

        <div class="field">
          <label for="line2">Line 2</label>
          <div class="inputRow">
            <input id="line2" maxlength="16" placeholder="Copenhagen" autocomplete="off" />
            <div class="counter"><span id="c2">0</span>/16</div>
          </div>
        </div>

        <div class="actions">
          <button class="btn primary" id="sendBtn">Send to LCD</button>
          <button class="btn" id="clearBtn" type="button">Clear</button>
        </div>

        <div class="hint">
          Tip: Use <kbd>Ctrl</kbd>/<kbd>⌘</kbd> + <kbd>Enter</kbd> to send.
        </div>

        <div class="chips">
          <button class="chip" data-l1="Hello" data-l2="World">Hello | World</button>
          <button class="chip" data-l1="Status" data-l2="All good">Status | All good</button>
          <button class="chip" data-l1="Temp" data-l2="21.6 C">Temp | 21.6 C</button>
          <button class="chip" data-l1="Voltage" data-l2="12.4 V">Voltage | 12.4 V</button>
        </div>

        <div class="status" id="statusBox">
          <div class="statusDot" id="statusDot"></div>
          <div class="statusText" id="status">Ready.</div>
        </div>
      </section>

      <section class="card">
        <h2>Preview</h2>

        <div class="lcdPreview" aria-label="LCD Preview">
          <div class="lcdLine" id="p1"></div>
          <div class="lcdLine" id="p2"></div>
        </div>

        <h3 class="subhead">History</h3>
        <div class="history" id="history"></div>
      </section>
    </main>

    <footer class="footer">
      <span>16 characters per line. Longer text is truncated.</span>
    </footer>
  </div>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
